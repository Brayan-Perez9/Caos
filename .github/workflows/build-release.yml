name: Build Windows y Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: caos-release-latest
  cancel-in-progress: true

jobs:
  build-windows:
    name: Compilar Caos.exe y publicar latest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compilar con Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.29f1
          targetPlatform: StandaloneWindows64
          projectPath: .
          buildName: Caos
          buildsPath: build

      - name: Escribir versión (commit)
        shell: bash
        run: |
          TARGET="build/StandaloneWindows64/Caos_Data/StreamingAssets"
          mkdir -p "$TARGET"
          printf '%s' "$GITHUB_SHA" > "$TARGET/caos-version.txt"

      - name: Añadir instrucciones al build
        shell: bash
        run: |
          cat > build/StandaloneWindows64/LEEME.txt <<'EOF'
          CAOS EXPRESS

          1. Extrae toda esta carpeta en un sitio fijo (Escritorio > Caos, por ejemplo).
          2. Abre Caos.exe.
          3. Menú > LOBBY MULTIJUGADOR para jugar con un amigo.

          El anfitrión crea una sala, copia el código CAOS-XXXXXXXXXX y tu amigo lo escribe en su lobby.

          Para actualizar: abre el juego; si hay versión nueva, pulsa ACTUALIZAR Y REINICIAR.
          También puedes descargar siempre la última versión desde:
          https://github.com/Brayan-Perez9/Caos/releases/latest/download/Caos-Windows.zip
          EOF

      - name: Crear ZIP descargable
        shell: bash
        run: |
          cd build/StandaloneWindows64
          zip -r -q ../../Caos-Windows.zip .

      - name: Publicar/actualizar Release latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Caos Windows (última versión)
          body: |
            Build automático del commit `${{ github.sha }}`.

            Descarga: **Caos-Windows.zip**
            Extrae y abre `Caos.exe`.
          files: Caos-Windows.zip
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
