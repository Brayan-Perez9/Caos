name: Build Windows y Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: caos-release-latest
  cancel-in-progress: true

jobs:
  build-windows:
    name: Compilar Caos.exe y publicar latest
    runs-on: [self-hosted, Windows, Unity]
    timeout-minutes: 45
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Compilar con Unity instalado
        shell: powershell
        run: |
          $unity = 'C:\Program Files\Unity\Hub\Editor\6000.3.29f1\Editor\Unity.exe'
          $log = Join-Path $env:GITHUB_WORKSPACE 'unity-build.log'
          $arguments = @(
            '-batchmode', '-nographics', '-quit',
            '-projectPath', $env:GITHUB_WORKSPACE,
            '-executeMethod', 'Caos.EditorTools.BuildCaos.BuildWindows',
            '-logFile', $log
          )
          $process = Start-Process -FilePath $unity -ArgumentList $arguments -Wait -PassThru
          if (Test-Path $log) { Get-Content $log -Tail 80 }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Escribir versión (commit)
        shell: powershell
        run: |
          $target = Join-Path $env:GITHUB_WORKSPACE 'Builds\Windows\Caos_Data\StreamingAssets'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Set-Content -Path (Join-Path $target 'caos-version.txt') -Value $env:GITHUB_SHA -NoNewline

      - name: Añadir instrucciones y crear ZIP
        id: zip
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'caos-release-stage'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'Caos-Windows.zip'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'Builds\Windows\*') -Destination $stage -Recurse -Force -Exclude 'Caos_BurstDebugInformation_DoNotShip'
          @(
            'CAOS EXPRESS',
            '',
            '1. Extrae toda esta carpeta en un sitio fijo (Escritorio > Caos, por ejemplo).',
            '2. Abre Caos.exe.',
            '3. Menú > LOBBY MULTIJUGADOR para jugar con un amigo.',
            '',
            'El anfitrión crea una sala, copia el código CAOS-XXXXXXXXXX y tu amigo lo escribe en su lobby.',
            '',
            'Para actualizar: abre el juego; si hay versión nueva, pulsa ACTUALIZAR Y REINICIAR.',
            'También puedes descargar la última versión desde:',
            'https://github.com/Brayan-Perez9/Caos/releases/latest/download/Caos-Windows.zip'
          ) | Set-Content -Path (Join-Path $stage 'LEEME.txt')
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Publicar/actualizar Release latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Caos Windows (última versión)
          body: |
            Build automático del commit `${{ github.sha }}`.

            Descarga: **Caos-Windows.zip**
            Extrae y abre `Caos.exe`.
          files: ${{ steps.zip.outputs.zip }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
